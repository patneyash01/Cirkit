<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <defs>
    <linearGradient id="cirkit-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#1e3a8a" />
      <stop offset="50%" stopColor="#0f172a" />
      <stop offset="100%" stopColor="#0284c7" />
    </linearGradient>
    <linearGradient id="cirkit-chip-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#2563eb" />
      <stop offset="100%" stopColor="#1d4ed8" />
    </linearGradient>
    <linearGradient id="cirkit-gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#fbbf24" />
      <stop offset="100%" stopColor="#f59e0b" />
    </linearGradient>
    <filter id="cirkit-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Container Badge -->
  <rect x="4" y="4" width="92" height="92" rx="22" fill="url(#cirkit-bg-grad)" stroke="#38bdf8" stroke-width="2.5" stroke-opacity="0.6" />
  
  <!-- Subtle Circuit Grid Backdrop -->
  <path d="M20 50 H32 M68 50 H80 M50 20 V32 M50 68 V80" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.4" />
  <path d="M24 30 H36 M64 30 H76 M24 70 H36 M64 70 H76" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" opacity="0.3" />

  <!-- Peripheral Circuit Track Lines & Terminals with Solder Eyelets -->
  <!-- Top Left Track -->
  <path d="M 22 22 L 32 32 H 38" stroke="url(#cirkit-gold-grad)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="22" cy="22" r="3" fill="#fbbf24" stroke="#78350f" stroke-width="0.8" />
  
  <!-- Top Right Track -->
  <path d="M 78 22 L 68 32 H 62" stroke="url(#cirkit-gold-grad)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="78" cy="22" r="3" fill="#fbbf24" stroke="#78350f" stroke-width="0.8" />

  <!-- Bottom Left Track -->
  <path d="M 22 78 L 32 68 H 38" stroke="url(#cirkit-gold-grad)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="22" cy="78" r="3" fill="#fbbf24" stroke="#78350f" stroke-width="0.8" />

  <!-- Bottom Right Track -->
  <path d="M 78 78 L 68 68 H 62" stroke="url(#cirkit-gold-grad)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="78" cy="78" r="3" fill="#fbbf24" stroke="#78350f" stroke-width="0.8" />

  <!-- Central IC Microprocessor Silicon Body -->
  <rect x="34" y="34" width="32" height="32" rx="8" fill="url(#cirkit-chip-grad)" stroke="#60a5fa" stroke-width="2" filter="url(#cirkit-glow)" />

  <!-- IC Chip Connector Pins -->
  <!-- Top Pins -->
  <rect x="39" y="28" width="3" height="6" rx="1" fill="#e2e8f0" />
  <rect x="48.5" y="28" width="3" height="6" rx="1" fill="#e2e8f0" />
  <rect x="58" y="28" width="3" height="6" rx="1" fill="#e2e8f0" />
  <!-- Bottom Pins -->
  <rect x="39" y="66" width="3" height="6" rx="1" fill="#e2e8f0" />
  <rect x="48.5" y="66" width="3" height="6" rx="1" fill="#e2e8f0" />
  <rect x="58" y="66" width="3" height="6" rx="1" fill="#e2e8f0" />
  <!-- Left Pins -->
  <rect x="28" y="39" width="6" height="3" rx="1" fill="#e2e8f0" />
  <rect x="28" y="48.5" width="6" height="3" rx="1" fill="#e2e8f0" />
  <rect x="28" y="58" width="6" height="3" rx="1" fill="#e2e8f0" />
  <!-- Right Pins -->
  <rect x="66" y="39" width="6" height="3" rx="1" fill="#e2e8f0" />
  <rect x="66" y="48.5" width="6" height="3" rx="1" fill="#e2e8f0" />
  <rect x="66" y="58" width="6" height="3" rx="1" fill="#e2e8f0" />

  <!-- Core Circuit Energy Ring & Electric Pulse Center -->
  <circle cx="50" cy="50" r="8" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3 2" />
  <circle cx="50" cy="50" r="4.5" fill="#f8fafc" />
  <circle cx="50" cy="50" r="2.5" fill="#38bdf8" />
</svg>
